<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实体剖面实时预览器（模板缓冲封口）</title>
<style>
  html,body{margin:0;height:100%;background:#14161a;color:#dde1e6;font:13px/1.5 system-ui,sans-serif}
  #app{display:flex;height:100%}
  #view{flex:1;position:relative;min-width:0}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #panel{width:340px;overflow-y:auto;padding:10px 14px;background:#1c1f24;border-left:1px solid #333}
  h1{font-size:15px;margin:4px 0 10px}
  h2{font-size:13px;margin:14px 0 6px;color:#9fb4c8}
  label{display:block;margin:4px 0}
  select,button,input[type=range]{width:100%;margin:2px 0}
  button{cursor:pointer}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .status{background:#12141a;border:1px solid #2c313a;padding:6px 8px;margin:6px 0;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
  .warn{border-color:#a33;color:#ffb0b0}
  .ok{color:#9fe6a0}
  .bad{color:#ff9c9c}
  #selftest li.pass{color:#9fe6a0}#selftest li.fail{color:#ff9c9c}
  #selftest{padding-left:18px;margin:6px 0}
  details{margin-top:10px}summary{cursor:pointer;color:#9fb4c8}
  .note{color:#9aa4ae;font-size:12px}
  kbd{background:#2a2e35;border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="gl"></canvas></div>
  <div id="panel">
    <h1>实体剖面实时预览器</h1>

    <h2>模型</h2>
    <select id="model"></select>
    <div id="ambiguity" class="status warn" style="display:none"></div>

    <h2>剖切平面</h2>
    <div class="row">
      <label>法线 X<input type="radio" name="axis" value="x"></label>
      <label>法线 Y<input type="radio" name="axis" value="y"></label>
      <label>法线 Z<input type="radio" name="axis" value="z" checked></label>
    </div>
    <input id="planeD" type="range" min="-1.6" max="1.6" step="0.005" value="0">
    <div class="note">拖动滑块或 <kbd>Shift</kbd>+拖动画面：连续移动剖面。左键拖动旋转，滚轮缩放，单击剖面：拾取分类。</div>

    <h2>截面内部判定语义</h2>
    <label><input type="radio" name="sem" value="winding" checked> 绕数（带符号计数，依赖一致定向）</label>
    <label><input type="radio" name="sem" value="parity"> 奇偶（INVERT，方向无关）</label>

    <h2>状态（模板/深度顺序分析）</h2>
    <div id="status" class="status">…</div>

    <h2>拾取</h2>
    <div id="pick" class="status">尚未拾取。单击剖切面。</div>

    <h2>导出</h2>
    <button id="export">导出截面轮廓（JSON + SVG）</button>
    <div class="note">范围说明：仅导出平面与源三角面的交线轮廓。剖面封口是模板缓冲的实时渲染效果，<b>未生成可制造的闭合几何</b>；源网格始终保持未切割状态。</div>

    <h2>验收自检（直接核对模板与深度缓冲作用）</h2>
    <button id="runTests">运行 GL 自检</button>
    <ul id="selftest"></ul>

    <details>
      <summary>实现说明（管线与限制）</summary>
      <div class="note" id="implnote"></div>
    </details>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
